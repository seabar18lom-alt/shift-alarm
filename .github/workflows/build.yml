name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: shift-alarm-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Extract source
        run: |
          if [ ! -f shift-alarm/android/app/build.gradle.kts ]; then
            unzip -o -q shift-alarm-github.zip
          fi

      - name: Publish unpacked source for maintainability
        run: |
          if ! git ls-files --error-unmatch shift-alarm/android/app/build.gradle.kts >/dev/null 2>&1; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add shift-alarm/
            git commit -m 'Expose Android source files for updates'
            git push origin HEAD:main
          fi

      - name: Restore signing key
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          test -n "$SIGNING_KEY_BASE64" || { echo "SIGNING_KEY_BASE64 secret is missing"; exit 1; }
          test -n "$SIGNING_PASSWORD" || { echo "SIGNING_PASSWORD secret is missing"; exit 1; }
          printf '%s' "$SIGNING_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/shift-alarm.jks"
          chmod 600 "$RUNNER_TEMP/shift-alarm.jks"

      - name: Configure version and signing
        run: |
          echo "APP_VERSION=0.1.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          python3 - <<'PY'
          from pathlib import Path

          p = Path("shift-alarm/android/app/build.gradle.kts")
          s = p.read_text(encoding="utf-8")
          s += '''
          android {
              defaultConfig {
                  versionCode = 1000 + System.getenv("GITHUB_RUN_NUMBER").toInt()
                  versionName = "0.1." + System.getenv("GITHUB_RUN_NUMBER")
              }
              signingConfigs {
                  create("distribution") {
                      storeFile = file(System.getenv("RUNNER_TEMP") + "/shift-alarm.jks")
                      storePassword = System.getenv("SIGNING_PASSWORD")
                      keyAlias = "shift-alarm"
                      keyPassword = System.getenv("SIGNING_PASSWORD")
                  }
              }
              buildTypes {
                  getByName("release") {
                      signingConfig = signingConfigs.getByName("distribution")
                  }
              }
          }
          '''
          p.write_text(s, encoding="utf-8")
          PY

      - name: Build signed APK
        working-directory: shift-alarm/android
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Prepare APK
        run: |
          mkdir -p dist
          cp shift-alarm/android/app/build/outputs/apk/release/app-release.apk dist/shift-alarm.apk

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${APP_VERSION}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/shift-alarm.apk --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" dist/shift-alarm.apk \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Shift Alarm $TAG" \
              --notes "교대알람 업데이트" \
              --latest
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: shift-alarm-apk
          path: dist/shift-alarm.apk
          if-no-files-found: error

      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/shift-alarm.jks"
